<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Note Generator</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
}
label{
    font-weight:bold;
    margin-top:12px;
    display:block;
}
textarea,
input,
select{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
textarea{
    min-height:80px;
}
.hidden{
    display:none;
}
.output{
    white-space:pre-wrap;
    border:1px solid #ccc;
    border-radius:10px;
    padding:14px;
    min-height:220px;
    background:#fff;
}
.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}
button{
    padding:10px 14px;
    border-radius:10px;
    border:0;
    background:#111;
    color:#fff;
    cursor:pointer;
}
button.secondary{
    background:#eee;
    color:#111;
    border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<h2>Note Generator</h2>

<div class="card">

<label>What was the issue reported:</label>
<textarea id="issue"></textarea>

<label>What was found with unit:</label>
<textarea id="found"></textarea>

<label>What was the repair outcome?</label>
<select id="repairOutcome">
    <option value="">Select</option>
    <option>Repair</option>
    <option>Unrepairable</option>
    <option>Refused to Repair</option>
</select>

<div id="resolutionWrap" class="hidden">
    <label>Was it an Exchange or a Sale?</label>
    <select id="resolutionType">
        <option value="">Select</option>
        <option>Exchange</option>
        <option>Sale</option>
    </select>
</div>

<div id="replacementWrap" class="hidden">
    <label>Did customer purchase a replacement?</label>
    <select id="replacementPurchased">
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
    </select>
</div>

<div id="exchangeSourceWrap" class="hidden">
    <label>Does the exchange come from Warehouse or DSC stock?</label>
    <select id="exchangeSource">
        <option value="">Select</option>
        <option>Warehouse</option>
        <option>DSC</option>
    </select>
</div>

<div id="saleSourceWrap" class="hidden">
    <label>Does the sale come from Warehouse or DSC stock?</label>
    <select id="saleSource">
        <option value="">Select</option>
        <option>Warehouse</option>
        <option>DSC</option>
    </select>
</div>

<div id="dscSerialWrap" class="hidden">
    <label>Please provide the serial number:</label>
    <input type="text" id="dscSerial">
</div>

<div id="exchangeWhyWrap" class="hidden">
    <label>If exchange, why was it exchanged?</label>
    <textarea id="exchangeWhy"></textarea>
</div>

<label>Advise customer:</label>
<textarea id="advise"></textarea>

<label>Return tracking number:</label>
<select id="trackingMode">
    <option value="">Select</option>
    <option value="N/A Walk-In">N/A Walk-In</option>
    <option value="Enter Tracking">Enter Tracking</option>
</select>

<div id="trackingWrap" class="hidden">
    <label>Tracking number:</label>
    <input type="text" id="tracking">
</div>

<div class="actions">
    <button id="copyBtn">Copy Notes</button>
    <button id="clearBtn" class="secondary">Clear</button>
</div>

</div>

<div class="card">
    <h3>Generated Notes</h3>
    <div class="output" id="output"></div>
</div>

</div>

<script>

const $ = id => document.getElementById(id);

const issue = $("issue");
const found = $("found");

const repairOutcome = $("repairOutcome");

const resolutionWrap = $("resolutionWrap");
const resolutionType = $("resolutionType");

const replacementWrap = $("replacementWrap");
const replacementPurchased = $("replacementPurchased");

const exchangeSource = $("exchangeSource");
const exchangeSourceWrap = $("exchangeSourceWrap");

const saleSource = $("saleSource");
const saleSourceWrap = $("saleSourceWrap");

const dscSerial = $("dscSerial");
const dscSerialWrap = $("dscSerialWrap");

const exchangeWhy = $("exchangeWhy");
const exchangeWhyWrap = $("exchangeWhyWrap");

const advise = $("advise");

const trackingMode = $("trackingMode");
const trackingWrap = $("trackingWrap");
const tracking = $("tracking");

const output = $("output");

function updateConditional(){

    const isUnrepairable =
        repairOutcome.value === "Unrepairable";

    const isRefused =
        repairOutcome.value === "Refused to Repair";

    const isExchange =
        isUnrepairable &&
        resolutionType.value === "Exchange";

    const isSale =
        (isUnrepairable &&
         resolutionType.value === "Sale")
        ||
        (isRefused &&
         replacementPurchased.value === "Yes");

    resolutionWrap.classList.toggle(
        "hidden",
        !isUnrepairable
    );

    replacementWrap.classList.toggle(
        "hidden",
        !isRefused
    );

    exchangeSourceWrap.classList.toggle(
        "hidden",
        !isExchange
    );

    exchangeWhyWrap.classList.toggle(
        "hidden",
        !isExchange
    );

    saleSourceWrap.classList.toggle(
        "hidden",
        !isSale
    );

    const showSerial =
        (isExchange &&
         exchangeSource.value === "DSC")
        ||
        (isSale &&
         saleSource.value === "DSC");

    dscSerialWrap.classList.toggle(
        "hidden",
        !showSerial
    );

    trackingWrap.classList.toggle(
        "hidden",
        trackingMode.value !== "Enter Tracking"
    );
}

    lines.push(`| What was the repair outcome?: ${repairOutcome.value}`);

    if(repairOutcome.value === "Unrepairable"){

        lines.push(

        );

        if(resolutionType.value

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Note Generator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:12px;
padding:16px;
margin-bottom:16px;
}

label{
font-weight:bold;
margin-top:12px;
display:block;
}

textarea,
input,
select{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

textarea{
min-height:80px;
}

.hidden{
display:none;
}

.output{
white-space:pre-wrap;
border:1px solid #ccc;
border-radius:10px;
padding:14px;
min-height:220px;
background:#fff;
}

.actions{
display:flex;
gap:10px;
margin-top:12px;
}

button{
padding:10px 14px;
border-radius:10px;
border:0;
background:#111;
color:#fff;
cursor:pointer;
}

button.secondary{
background:#eee;
color:#111;
border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<h2>Note Generator</h2>

<div class="card">

<label>What was the issue reported?</label>
<textarea id="issue"></textarea>

<label>What was found with unit?</label>
<textarea id="found"></textarea>


<label>What was the repair outcome?</label>
<select id="repairOutcome">
<option value="">Select</option>
<option value="Repair">Repair</option>
<option value="No Fault Found">No Fault Found</option>
<option value="Unrepairable">Unrepairable</option>
<option value="Refused to Repair">Refused to Repair</option>
</select>


<!-- REPAIR SALES ORDER -->

<div id="repairSalesOrderWrap" class="hidden">

<label>Was any customer-fit part shipped from the warehouse through a Sales Order because it was unavailable at the DSC?</label>
<select id="repairSalesOrder">
<option value="">Select</option>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>

</div>


<div id="repairSalesOrderNumberWrap" class="hidden">

<label>Enter the Sales Order number:</label>
<input type="text" id="repairSalesOrderNumber">

</div>


<!-- UNREPAIRABLE -->

<div id="unrepairableWrap" class="hidden">

<label>What was the resolution?</label>
<select id="unrepairableAction">
<option value="">Select</option>
<option value="Exchange">Exchange</option>
<option value="Sale">Sale</option>
<option value="Customer Declined Replacement">
Customer Declined Replacement
</option>
</select>

</div>


<!-- EXCHANGE -->

<div id="exchangeSourceWrap" class="hidden">

<label>Does the Exchange come from Warehouse or DSC stock?</label>
<select id="exchangeSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="exchangeSerialWrap" class="hidden">

<label>Enter the serial number of the replacement unit provided to the customer from DSC:</label>
<input type="text" id="exchangeSerial">

</div>


<div id="exchangeWhyWrap" class="hidden">

<label>If exchange, why was it exchanged?</label>
<textarea id="exchangeWhy"></textarea>

</div>


<!-- UNREPAIRABLE SALE -->

<div id="unrepairableSaleSourceWrap" class="hidden">

<label>Does the Sale come from Warehouse or DSC stock?</label>
<select id="unrepairableSaleSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="unrepairableSaleSerialWrap" class="hidden">

<label>Enter the serial number of the replacement unit provided to the customer from DSC:</label>
<input type="text" id="unrepairableSaleSerial">

</div>


<!-- REFUSED TO REPAIR -->

<div id="replacementWrap" class="hidden">

<label>Did the customer purchase a replacement?</label>
<select id="replacementPurchased">
<option value="">Select</option>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>

</div>


<!-- REFUSED TO REPAIR SALE -->

<div id="refusedSaleSourceWrap" class="hidden">

<label>Does the Sale come from Warehouse or DSC stock?</label>
<select id="refusedSaleSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="refusedSaleSerialWrap" class="hidden">

<label>Enter the serial number of the replacement unit provided to the customer from DSC:</label>
<input type="text" id="refusedSaleSerial">

</div>


<!-- RECYCLE -->

<div id="recycleWrap" class="hidden">

<label>Did the customer choose to recycle their unit?</label>
<select id="recycleChoice">
<option value="">Select</option>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>

</div>


<div id="recycleSerialWrap" class="hidden">

<label>Enter the serial number of the unit being recycled:</label>
<input type="text" id="recycleSerial">

</div>


<!-- ADVISE CUSTOMER -->

<label>Advise customer:</label>
<textarea id="advise"></textarea>


<!-- NO FAULT FOUND -->

<div id="noFaultFoundWrap" class="hidden">

<label>No Fault Found:</label>

<textarea id="noFaultFoundNotes"></textarea>

</div>


<!-- RETURN TRACKING -->

<div id="returnTrackingSection" class="hidden">

<label>Return tracking number:</label>

<select id="trackingMode">
<option value="">Select</option>
<option value="N/A Walk-In">N/A Walk-In</option>
<option value="Enter Tracking">Enter Tracking</option>
</select>

<div id="trackingWrap" class="hidden">

<label>Tracking number:</label>
<input type="text" id="tracking">

</div>

</div>


<div class="actions">

<button id="copyBtn">Copy Notes</button>

<button id="clearBtn" class="secondary">
Clear
</button>

</div>

</div>


<div class="card">

<h3>Generated Notes</h3>

<div class="output" id="output"></div>

</div>

</div>


<script>

const $ = id =>
document.getElementById(id);


/* BASIC FIELDS */

const issue = $("issue");
const found = $("found");

const repairOutcome =
$("repairOutcome");


/* REPAIR SALES ORDER */

const repairSalesOrderWrap =
$("repairSalesOrderWrap");

const repairSalesOrder =
$("repairSalesOrder");

const repairSalesOrderNumberWrap =
$("repairSalesOrderNumberWrap");

const repairSalesOrderNumber =
$("repairSalesOrderNumber");


/* UNREPAIRABLE */

const unrepairableWrap =
$("unrepairableWrap");

const unrepairableAction =
$("unrepairableAction");


/* EXCHANGE */

const exchangeSourceWrap =
$("exchangeSourceWrap");

const exchangeSource =
$("exchangeSource");

const exchangeSerialWrap =
$("exchangeSerialWrap");

const exchangeSerial =
$("exchangeSerial");

const exchangeWhyWrap =
$("exchangeWhyWrap");

const exchangeWhy =
$("exchangeWhy");


/* UNREPAIRABLE SALE */

const unrepairableSaleSourceWrap =
$("unrepairableSaleSourceWrap");

const unrepairableSaleSource =
$("unrepairableSaleSource");

const unrepairableSaleSerialWrap =
$("unrepairableSaleSerialWrap");

const unrepairableSaleSerial =
$("unrepairableSaleSerial");


/* REFUSED TO REPAIR */

const replacementWrap =
$("replacementWrap");

const replacementPurchased =
$("replacementPurchased");

const refusedSaleSourceWrap =
$("refusedSaleSourceWrap");

const refusedSaleSource =
$("refusedSaleSource");

const refusedSaleSerialWrap =
$("refusedSaleSerialWrap");

const refusedSaleSerial =
$("refusedSaleSerial");


/* RECYCLE */

const recycleWrap =
$("recycleWrap");

const recycleChoice =
$("recycleChoice");

const recycleSerialWrap =
$("recycleSerialWrap");

const recycleSerial =
$("recycleSerial");


/* ADVISE CUSTOMER */

const advise =
$("advise");


/* NO FAULT FOUND */

const noFaultFoundWrap =
$("noFaultFoundWrap");

const noFaultFoundNotes =
$("noFaultFoundNotes");


/* RETURN TRACKING */

const returnTrackingSection =
$("returnTrackingSection");

const trackingMode =
$("trackingMode");

const trackingWrap =
$("trackingWrap");

const tracking =
$("tracking");


const output =
$("output");


/* NO FAULT FOUND PRE-FILLED TEXT */

const noFaultAdviseDefault =
`Unit performance tested and confirmed to meet Dyson SQS standards. Customer advised of No Fault Found results and provided troubleshooting recommendations. Initial outreach completed via text/email on [DATE/TIME]. Follow-up phone call and voicemail completed on [DATE/TIME].`;


const noFaultProcessDefault =
`No Fault Found documented. Unit held for 48 hours from initial outreach. [NO RESPONSE RECEIVED / CUSTOMER CONTACTED]. Unit [RETURNED TO CUSTOMER / CUSTOMER PICKED UP UNIT] per No Fault Found process.`;


/* SOURCE DISPLAY */

function sourceText(value){

if(value === "DSC"){
return "Dyson Service Center";
}

return value;

}


/* CONDITIONAL FORM LOGIC */

function updateConditional(){

const outcome =
repairOutcome.value;


const isRepair =
outcome === "Repair";


const isNoFaultFound =
outcome === "No Fault Found";


const isUnrepairable =
outcome === "Unrepairable";


const isRefused =
outcome === "Refused to Repair";


/* REPAIR SALES ORDER */

repairSalesOrderWrap.classList.toggle(
"hidden",
!isRepair
);


repairSalesOrderNumberWrap.classList.toggle(
"hidden",
!(
isRepair &&
repairSalesOrder.value === "Yes"
)
);


/* NO FAULT FOUND */

noFaultFoundWrap.classList.toggle(
"hidden",
!isNoFaultFound
);


if(isNoFaultFound){

if(advise.value.trim() === ""){

advise.value =
noFaultAdviseDefault;

advise.dataset.nffPrefill =
"true";

}


if(noFaultFoundNotes.value.trim() === ""){

noFaultFoundNotes.value =
noFaultProcessDefault;

}

}


/*
If employee switches away from NFF,
only remove the Advise message if it
was automatically inserted and hasn't
been changed.
*/

if(
!isNoFaultFound &&
advise.dataset.nffPrefill === "true" &&
advise.value === noFaultAdviseDefault
){

advise.value = "";

delete advise.dataset.nffPrefill;

}


/* UNREPAIRABLE */

unrepairableWrap.classList.toggle(
"hidden",
!isUnrepairable
);


const isExchange =
isUnrepairable &&
unrepairableAction.value ===
"Exchange";


const isUnrepairableSale =
isUnrepairable &&
unrepairableAction.value ===
"Sale";


const isDeclinedReplacement =
isUnrepairable &&
unrepairableAction.value ===
"Customer Declined Replacement";


/* EXCHANGE */

exchangeSourceWrap.classList.toggle(
"hidden",
!isExchange
);


exchangeSerialWrap.classList.toggle(
"hidden",
!(
isExchange &&
exchangeSource.value === "DSC"
)
);


exchangeWhyWrap.classList.toggle(
"hidden",
!isExchange
);


/* UNREPAIRABLE SALE */

unrepairableSaleSourceWrap.classList.toggle(
"hidden",
!isUnrepairableSale
);


unrepairableSaleSerialWrap.classList.toggle(
"hidden",
!(
isUnrepairableSale &&
unrepairableSaleSource.value ===
"DSC"
)
);


/* REFUSED TO REPAIR */

replacementWrap.classList.toggle(
"hidden",
!isRefused
);


const refusedPurchasedYes =
isRefused &&
replacementPurchased.value === "Yes";


refusedSaleSourceWrap.classList.toggle(
"hidden",
!refusedPurchasedYes
);


refusedSaleSerialWrap.classList.toggle(
"hidden",
!(
refusedPurchasedYes &&
refusedSaleSource.value === "DSC"
)
);


/* RECYCLE */

const showRecycleSection =
isUnrepairableSale ||
isDeclinedReplacement ||
isRefused;


recycleWrap.classList.toggle(
"hidden",
!showRecycleSection
);


const recycleYes =
showRecycleSection &&
recycleChoice.value === "Yes";


recycleSerialWrap.classList.toggle(
"hidden",
!recycleYes
);


/* RETURN TRACKING */

const repairNeedsTracking =
isRepair;


const noFaultNeedsTracking =
isNoFaultFound;


const declinedNeedsTracking =
isDeclinedReplacement &&
recycleChoice.value === "No";


const refusedNeedsTracking =
isRefused &&
replacementPurchased.value === "No" &&
recycleChoice.value === "No";


const showReturnTracking =
repairNeedsTracking ||
noFaultNeedsTracking ||
declinedNeedsTracking ||
refusedNeedsTracking;


returnTrackingSection.classList.toggle(
"hidden",
!showReturnTracking
);


trackingWrap.classList.toggle(
"hidden",
!showReturnTracking ||
trackingMode.value !==
"Enter Tracking"
);

}


/* GENERATED NOTES */

function buildNotes(){

const lines = [];


lines.push(
`| What was the issue reported: ${issue.value}`
);


lines.push(
`| What was found with unit: ${found.value}`
);


lines.push(
`| What was the repair outcome?: ${repairOutcome.value}`
);


/* REPAIR */

if(
repairOutcome.value === "Repair" &&
repairSalesOrder.value === "Yes"
){

lines.push(
`| Parts shipped from Warehouse via Sales Order: Yes`
);


lines.push(
`| Sales Order number: ${repairSalesOrderNumber.value}`
);

}


/* UNREPAIRABLE */

if(
repairOutcome.value ===
"Unrepairable"
){

lines.push(
`| What was the resolution?: ${unrepairableAction.value}`
);


/* EXCHANGE */

if(
unrepairableAction.value ===
"Exchange"
){

lines.push(
`| Unit provided from: ${sourceText(exchangeSource.value)}`
);


if(
exchangeSource.value ===
"DSC"
){

lines.push(
`| Replacement unit serial number: ${exchangeSerial.value}`
);

}


lines.push(
`| If exchange, why was it exchanged?: ${exchangeWhy.value}`
);

}


/* SALE */

if(
unrepairableAction.value ===
"Sale"
){

lines.push(
`| Unit provided from: ${sourceText(unrepairableSaleSource.value)}`
);


if(
unrepairableSaleSource.value ===
"DSC"
){

lines.push(
`| Replacement unit serial number: ${unrepairableSaleSerial.value}`
);

}


lines.push(
`| Did the customer choose to recycle their unit?: ${recycleChoice.value}`
);


if(
recycleChoice.value ===
"Yes"
){

lines.push(
`| Recycled unit serial number: ${recycleSerial.value}`
);

}

}


/* CUSTOMER DECLINED */

if(
unrepairableAction.value ===
"Customer Declined Replacement"
){

lines.push(
`| Did the customer choose to recycle their unit?: ${recycleChoice.value}`
);


if(
recycleChoice.value ===
"Yes"
){

lines.push(
`| Recycled unit serial number: ${recycleSerial.value}`
);

}

}

}


/* REFUSED TO REPAIR */

if(
repairOutcome.value ===
"Refused to Repair"
){

lines.push(
`| Did the customer purchase a replacement?: ${replacementPurchased.value}`
);


if(
replacementPurchased.value ===
"Yes"
){

lines.push(
`| Unit provided from: ${sourceText(refusedSaleSource.value)}`
);


if(
refusedSaleSource.value ===
"DSC"
){

lines.push(
`| Replacement unit serial number: ${refusedSaleSerial.value}`
);

}

}


lines.push(
`| Did the customer choose to recycle their unit?: ${recycleChoice.value}`
);


if(
recycleChoice.value ===
"Yes"
){

lines.push(
`| Recycled unit serial number: ${recycleSerial.value}`
);

}

}


/* ADVISE CUSTOMER */

lines.push(
`| Advise customer: ${advise.value}`
);


/* NO FAULT FOUND */

if(
repairOutcome.value ===
"No Fault Found"
){

lines.push(
`| No Fault Found: ${noFaultFoundNotes.value}`
);

}


/* RETURN TRACKING */

const repairNeedsTracking =
repairOutcome.value ===
"Repair";


const noFaultNeedsTracking =
repairOutcome.value ===
"No Fault Found";


const declinedNeedsTracking =
repairOutcome.value ===
"Unrepairable" &&
unrepairableAction.value ===
"Customer Declined Replacement" &&
recycleChoice.value ===
"No";


const refusedNeedsTracking =
repairOutcome.value ===
"Refused to Repair" &&
replacementPurchased.value ===
"No" &&
recycleChoice.value ===
"No";


const showReturnTracking =
repairNeedsTracking ||
noFaultNeedsTracking ||
declinedNeedsTracking ||
refusedNeedsTracking;


if(showReturnTracking){

if(
trackingMode.value ===
"N/A Walk-In"
){

lines.push(
`| Return tracking number: N/A Walk-In`
);

}


else if(
trackingMode.value ===
"Enter Tracking"
){

lines.push(
`| Return tracking number: ${tracking.value}`
);

}

}


output.textContent =
lines.join("\n");

}


/* FORM EVENTS */

document
.querySelectorAll(
"textarea,input,select"
)
.forEach(el => {


el.addEventListener(
"input",
() => {

/*
If employee edits the automatically
inserted NFF Advise message, mark
it as their own text.
*/

if(
el === advise &&
advise.value !==
noFaultAdviseDefault
){

delete advise.dataset.nffPrefill;

}


updateConditional();

buildNotes();

}
);


el.addEventListener(
"change",
() => {

updateConditional();

buildNotes();

}
);

});


/* COPY NOTES */

$("copyBtn").onclick =
async () => {

await navigator.clipboard.writeText(
output.textContent
);


const toast =
document.createElement("div");


toast.textContent =
"Copied!";


toast.style.position =
"fixed";

toast.style.bottom =
"20px";

toast.style.right =
"20px";

toast.style.background =
"#111";

toast.style.color =
"#fff";

toast.style.padding =
"10px 14px";

toast.style.borderRadius =
"10px";


document.body.appendChild(
toast
);


setTimeout(
() => toast.remove(),
1200
);

};


/* CLEAR */

$("clearBtn").onclick =
() => {


document
.querySelectorAll(
"textarea,input"
)
.forEach(
e => e.value = ""
);


document
.querySelectorAll(
"select"
)
.forEach(
e => e.selectedIndex = 0
);


delete advise.dataset.nffPrefill;


updateConditional();

buildNotes();

};


/* INITIAL LOAD */

updateConditional();

buildNotes();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Note Generator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:12px;
padding:16px;
margin-bottom:16px;
}

label{
font-weight:bold;
margin-top:12px;
display:block;
}

textarea,
input,
select{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

textarea{
min-height:80px;
}

.hidden{
display:none;
}

.output{
white-space:pre-wrap;
border:1px solid #ccc;
border-radius:10px;
padding:14px;
min-height:220px;
background:#fff;
}

.actions{
display:flex;
gap:10px;
margin-top:12px;
}

button{
padding:10px 14px;
border-radius:10px;
border:0;
background:#111;
color:#fff;
cursor:pointer;
}

button.secondary{
background:#eee;
color:#111;
border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">

<h2>Note Generator</h2>

<div class="card">

<label>What was the issue reported?</label>
<textarea id="issue"></textarea>

<label>What was found with unit?</label>
<textarea id="found"></textarea>


<label>What was the repair outcome?</label>
<select id="repairOutcome">
<option value="">Select</option>
<option value="Repair">Repair</option>
<option value="Unrepairable">Unrepairable</option>
<option value="Refused to Repair">Refused to Repair</option>
</select>


<!-- UNREPAIRABLE FLOW -->

<div id="unrepairableWrap" class="hidden">

<label>Was it an Exchange or a Sale?</label>
<select id="unrepairableAction">
<option value="">Select</option>
<option value="Exchange">Exchange</option>
<option value="Sale">Sale</option>
</select>

</div>


<div id="exchangeSourceWrap" class="hidden">

<label>Does the Exchange come from Warehouse or DSC stock?</label>
<select id="exchangeSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="exchangeSerialWrap" class="hidden">

<label>Please provide the serial number for the Exchange:</label>
<input type="text" id="exchangeSerial">

</div>


<div id="exchangeWhyWrap" class="hidden">

<label>If exchange, why was it exchanged?</label>
<textarea id="exchangeWhy"></textarea>

</div>


<div id="unrepairableSaleSourceWrap" class="hidden">

<label>Does the Sale come from Warehouse or DSC stock?</label>
<select id="unrepairableSaleSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="unrepairableSaleSerialWrap" class="hidden">

<label>Please provide the serial number for the Sale:</label>
<input type="text" id="unrepairableSaleSerial">

</div>


<!-- REFUSED TO REPAIR FLOW -->

<div id="replacementWrap" class="hidden">

<label>Did the customer purchase a replacement?</label>
<select id="replacementPurchased">
<option value="">Select</option>
<option value="No">No</option>
<option value="Yes">Yes</option>
</select>

</div>


<div id="refusedSaleSourceWrap" class="hidden">

<label>Does the Sale come from Warehouse or DSC stock?</label>
<select id="refusedSaleSource">
<option value="">Select</option>
<option value="Warehouse">Warehouse</option>
<option value="DSC">DSC</option>
</select>

</div>


<div id="refusedSaleSerialWrap" class="hidden">

<label>Please provide the serial number for the Sale:</label>
<input type="text" id="refusedSaleSerial">

</div>


<label>Advise customer:</label>
<textarea id="advise"></textarea>


<!-- RETURN TRACKING -->

<div id="returnTrackingSection" class="hidden">

<label>Return tracking number:</label>
<select id="trackingMode">
<option value="">Select</option>
<option value="N/A Walk-In">N/A Walk-In</option>
<option value="Enter Tracking">Enter Tracking</option>
</select>

<div id="trackingWrap" class="hidden">

<label>Tracking number:</label>
<input type="text" id="tracking">

</div>

</div>


<div class="actions">
<button id="copyBtn">Copy Notes</button>
<button id="clearBtn" class="secondary">Clear</button>
</div>

</div>


<div class="card">

<h3>Generated Notes</h3>

<div class="output" id="output"></div>

</div>

</div>


<script>

const $ = id => document.getElementById(id);

const issue = $("issue");
const found = $("found");

const repairOutcome = $("repairOutcome");

const unrepairableWrap = $("unrepairableWrap");
const unrepairableAction = $("unrepairableAction");

const exchangeSourceWrap = $("exchangeSourceWrap");
const exchangeSource = $("exchangeSource");

const exchangeSerialWrap = $("exchangeSerialWrap");
const exchangeSerial = $("exchangeSerial");

const exchangeWhyWrap = $("exchangeWhyWrap");
const exchangeWhy = $("exchangeWhy");

const unrepairableSaleSourceWrap = $("unrepairableSaleSourceWrap");
const unrepairableSaleSource = $("unrepairableSaleSource");

const unrepairableSaleSerialWrap = $("unrepairableSaleSerialWrap");
const unrepairableSaleSerial = $("unrepairableSaleSerial");

const replacementWrap = $("replacementWrap");
const replacementPurchased = $("replacementPurchased");

const refusedSaleSourceWrap = $("refusedSaleSourceWrap");
const refusedSaleSource = $("refusedSaleSource");

const refusedSaleSerialWrap = $("refusedSaleSerialWrap");
const refusedSaleSerial = $("refusedSaleSerial");

const advise = $("advise");

const returnTrackingSection = $("returnTrackingSection");
const trackingMode = $("trackingMode");
const trackingWrap = $("trackingWrap");
const tracking = $("tracking");

const output = $("output");


function updateConditional(){

const outcome = repairOutcome.value;


/* REPAIR */

const isRepair =
outcome === "Repair";


/* UNREPAIRABLE */

const isUnrepairable =
outcome === "Unrepairable";

unrepairableWrap.classList.toggle(
"hidden",
!isUnrepairable
);


const isExchange =
isUnrepairable &&
unrepairableAction.value === "Exchange";

const isUnrepairableSale =
isUnrepairable &&
unrepairableAction.value === "Sale";


exchangeSourceWrap.classList.toggle(
"hidden",
!isExchange
);

exchangeSerialWrap.classList.toggle(
"hidden",
!(isExchange && exchangeSource.value === "DSC")
);

exchangeWhyWrap.classList.toggle(
"hidden",
!isExchange
);


unrepairableSaleSourceWrap.classList.toggle(
"hidden",
!isUnrepairableSale
);

unrepairableSaleSerialWrap.classList.toggle(
"hidden",
!(
isUnrepairableSale &&
unrepairableSaleSource.value === "DSC"
)
);


/* REFUSED TO REPAIR */

const isRefused =
outcome === "Refused to Repair";

replacementWrap.classList.toggle(
"hidden",
!isRefused
);


const refusedPurchasedYes =
isRefused &&
replacementPurchased.value === "Yes";


refusedSaleSourceWrap.classList.toggle(
"hidden",
!refusedPurchasedYes
);


refusedSaleSerialWrap.classList.toggle(
"hidden",
!(
refusedPurchasedYes &&
refusedSaleSource.value === "DSC"
)
);


/* RETURN TRACKING */

const showReturnTracking =
isRepair ||
(
isRefused &&
replacementPurchased.value === "No"
);


returnTrackingSection.classList.toggle(
"hidden",
!showReturnTracking
);


trackingWrap.classList.toggle(
"hidden",
!showReturnTracking ||
trackingMode.value !== "Enter Tracking"
);

}


function buildNotes(){

const lines = [];

lines.push(
`| What was the issue reported: ${issue.value}`
);

lines.push(
`| What was found with unit: ${found.value}`
);

lines.push(
`| What was the repair outcome?: ${repairOutcome.value}`
);


/* UNREPAIRABLE */

if(repairOutcome.value === "Unrepairable"){

lines.push(
`| Was it an Exchange or a Sale?: ${unrepairableAction.value}`
);


if(unrepairableAction.value === "Exchange"){

lines.push(
`| Exchange source: ${exchangeSource.value}`
);


if(exchangeSource.value === "DSC"){

lines.push(
`| Exchange serial number: ${exchangeSerial.value}`
);

}


lines.push(
`| If exchange, why was it exchanged?: ${exchangeWhy.value}`
);

}


if(unrepairableAction.value === "Sale"){

lines.push(
`| Sale source: ${unrepairableSaleSource.value}`
);


if(unrepairableSaleSource.value === "DSC"){

lines.push(
`| Sale serial number: ${unrepairableSaleSerial.value}`
);

}

}

}


/* REFUSED TO REPAIR */

if(repairOutcome.value === "Refused to Repair"){

lines.push(
`| Did the customer purchase a replacement?: ${replacementPurchased.value}`
);


if(replacementPurchased.value === "Yes"){

lines.push(
`| Sale source: ${refusedSaleSource.value}`
);


if(refusedSaleSource.value === "DSC"){

lines.push(
`| Sale serial number: ${refusedSaleSerial.value}`
);

}

}

}


lines.push(
`| Advise customer: ${advise.value}`
);


/* RETURN TRACKING */

const showReturnTracking =
repairOutcome.value === "Repair" ||
(
repairOutcome.value === "Refused to Repair" &&
replacementPurchased.value === "No"
);


if(showReturnTracking){

if(trackingMode.value === "N/A Walk-In"){

lines.push(
`| Return tracking number: N/A Walk-In`
);

}

else if(trackingMode.value === "Enter Tracking"){

lines.push(
`| Return tracking number: ${tracking.value}`
);

}

}


output.textContent = lines.join("\n");

}


document
.querySelectorAll("textarea,input,select")
.forEach(el => {

el.addEventListener("input", () => {

updateConditional();
buildNotes();

});


el.addEventListener("change", () => {

updateConditional();
buildNotes();

});

});


$("copyBtn").onclick = async () => {

await navigator.clipboard.writeText(
output.textContent
);


const toast =
document.createElement("div");

toast.textContent = "Copied!";

toast.style.position = "fixed";
toast.style.bottom = "20px";
toast.style.right = "20px";
toast.style.background = "#111";
toast.style.color = "#fff";
toast.style.padding = "10px 14px";
toast.style.borderRadius = "10px";


document.body.appendChild(toast);


setTimeout(
() => toast.remove(),
1200
);

};


$("clearBtn").onclick = () => {

document
.querySelectorAll("textarea,input")
.forEach(e => e.value = "");


document
.querySelectorAll("select")
.forEach(e => e.selectedIndex = 0);


updateConditional();
buildNotes();

};


updateConditional();
buildNotes();

</script>

</body>
</html>
